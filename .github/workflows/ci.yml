name: CI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./runner/...
      - name: Vet
        run: go vet ./runner/...
      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/alemonx-network-linux ./runner
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/alemonx-network-windows.exe ./runner
          GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/alemonx-network-darwin ./runner
      - name: Validate alx.json
        run: python3 scripts/validate-alx.py alx.json

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, binary: alemonx-network-windows-amd64.exe, bundle: alemonx-network-windows-amd64.zip }
          - { goos: darwin, goarch: arm64, binary: alemonx-network-darwin-arm64, bundle: alemonx-network-darwin-arm64.zip }
          - { goos: darwin, goarch: amd64, binary: alemonx-network-darwin-amd64, bundle: alemonx-network-darwin-amd64.zip }
          - { goos: linux, goarch: amd64, binary: alemonx-network-linux-amd64, bundle: alemonx-network-linux-amd64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build plugin bundle
        run: |
          mkdir -p "bundle/alemonx-network/dist" release
          cp alx.json "bundle/alemonx-network/alx.json"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "bundle/alemonx-network/dist/${{ matrix.binary }}" ./runner
          (cd bundle && zip -r "../release/${{ matrix.bundle }}" alemonx-network)
          (cd release && sha256sum "${{ matrix.bundle }}" > "${{ matrix.bundle }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256
          gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
